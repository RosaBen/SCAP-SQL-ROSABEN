rs |<br />+--------------+-------------+-------------+---------------------+---------------------+---------------------+----------+<br /><b><font color="#cc0066">|            1 | CTR         | hillm       | 2020-03-11 15:48:18 | 2020-04-02 08:57:12 | 2024-04-06 18:50:50 |       22 |<br />|            2 | OPE         | cassinyt    | 2020-04-22 10:01:34 | 2020-05-03 09:11:01 | 2024-04-06 18:50:50 |       11 |</font></b><br />+--------------+-------------+-------------+---------------------+---------------------+---------------------+----------+</div></div></div></foreignObject><text x="263" y="567" fill="#282828" font-family="Courier New" font-size="10px">table: disposer_archivage...</text></switch></g><path d="M 526.67 210.55 L 553.34 210.45 L 554.25 465.78 L 578.56 465.69 L 541 489.5 L 503.27 465.96 L 527.58 465.88 Z" fill="#cc0066" stroke="none" pointer-events="all"/><rect x="21" y="30" width="240" height="120" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><switch><foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 232px; height: 1px; padding-top: 20px; margin-left: 26px;"><div data-drawio-colors="color: #CC0066; " style="box-sizing: border-box; font-size: 0px; text-align: left; max-height: 130px; overflow: hidden;"><div style="display: inline-block; font-size: 10px; font-family: Helvetica; color: rgb(204, 0, 102); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;"><h1>Archivage</h1><p>Les données correspondant au retrait d'accès à un profil pour un employé doivent être conservées.<br />Il est demandé de ventiler ces données dans une table annexe à des fins analytiques.</p></div></div></div></foreignObject><text x="26" y="30" fill="#CC0066" font-family="Helvetica" font-size="10px">Archivage...</text></switch></g><rect x="634" y="59" width="103" height="15" rx="2.25" ry="2.25" fill-opacity="0.2" fill="#cc0066" stroke="rgb(0, 0, 0)" stroke-opacity="0.2" pointer-events="all"/><rect x="766" y="59" width="107" height="15" rx="2.25" ry="2.25" fill-opacity="0.2" fill="#cc0066" stroke="rgb(0, 0, 0)" stroke-opacity="0.2" pointer-events="all"/><rect x="709" y="299" width="73" height="15" rx="2.25" ry="2.25" fill-opacity="0.2" fill="#cc0066" stroke="rgb(0, 0, 0)" stroke-opacity="0.2" pointer-events="all"/><rect x="273" y="299" width="73" height="15" rx="2.25" ry="2.25" fill-opacity="0.2" fill="#cc0066" stroke="rgb(0, 0, 0)" stroke-opacity="0.2" pointer-events="all"/><rect x="362" y="579" width="410" height="15" rx="2.25" ry="2.25" fill-opacity="0.2" fill="#cc0066" stroke="rgb(0, 0, 0)" stroke-opacity="0.2" pointer-events="all"/><rect x="781" y="670" width="320" height="120" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><switch><foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 312px; height: 1px; padding-top: 660px; margin-left: 786px;"><div data-drawio-colors="color: #CC0066; " style="box-sizing: border-box; font-size: 0px; text-align: left; max-height: 130px; overflow: hidden;"><div style="display: inline-block; font-size: 10px; font-family: Helvetica; color: rgb(204, 0, 102); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;"><h1>Champs calculés</h1><p>La date d'enregistrement correspond à la date de réalisation de l'opération d'archivage (CURRENT_TIMESTAMP).</p><p>Le nombre de jours entre la date de mise à disposition et la date de confiscation doit être logiquement positive (DATEDIFF).</p></div></div></div></foreignObject><text x="786" y="670" fill="#CC0066" font-family="Helvetica" font-size="10px">Champs calculés...</text></switch></g><path d="M 897 555 L 892 555 Q 887 555 887 565 L 887 644 Q 887 654 882 654 L 879.5 654 Q 877 654 882 654 L 884.5 654 Q 887 654 887 664 L 887 743 Q 887 753 892 753 L 897 753" fill="none" stroke="#cc0066" stroke-miterlimit="10" transform="translate(887,0)scale(-1,1)translate(-887,0)rotate(-90,887,654)" pointer-events="all"/><path d="M 101 510 L 1101 509" fill="none" stroke="#46495d" stroke-opacity="0.5" stroke-width="3" stroke-miterlimit="10" stroke-dasharray="9 9" pointer-events="stroke"/><rect x="21" y="670" width="440" height="120" rx="18" ry="18" fill="none" stroke="#cc0066" stroke-width="2" pointer-events="all"/><rect x="42" y="670" width="379" height="120" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><switch><foreignObject pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible; text-align: left;"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe flex-start; justify-content: unsafe flex-start; width: 371px; height: 1px; padding-top: 660px; margin-left: 47px;"><div data-drawio-colors="color: #CC0066; " style="box-sizing: border-box; font-size: 0px; text-align: left; max-height: 130px; overflow: hidden;"><div style="display: inline-block; font-size: 10px; font-family: Helvetica; color: rgb(204, 0, 102); line-height: 1.2; pointer-events: all; white-space: normal; overflow-wrap: normal;"><h1>Travail</h1><p>1. Construire la table "disposer_archivage" permettant d'accueillir les données à archiver.</p><p>2. Rappatrier les données nécessaires pour alimenter la table "disposer_archivage" en ne prenant en compte que les comptes ayant perdus leur profil (soit les comptes qui ont une date de confiscation de renseignée).</p></div></div></div></foreignObject><text x="47" y="670" fill="#CC0066" font-family="Helvetica" font-size="10px">Travail...</text></switch></g></g></svg>